[project]
name = "ai_powered_linkedin_content_generator"
version = "0.1.0"
description = "ai_powered_linkedin_content_generator using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]==1.14.4",
]

[project.scripts]
ai_powered_linkedin_content_generator = "ai_powered_linkedin_content_generator.main:run"
run_crew = "ai_powered_linkedin_content_generator.main:run"
train = "ai_powered_linkedin_content_generator.main:train"
replay = "ai_powered_linkedin_content_generator.main:replay"
test = "ai_powered_linkedin_content_generator.main:test"
run_with_trigger = "ai_powered_linkedin_content_generator.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
